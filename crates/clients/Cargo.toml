[package]
name = "discord-rust-clients"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP REST client, WebSocket gateway connection, sharding manager, cache, and bot runner for discord-rust."

[features]
default = ["tls"]
# Enables the rustls-backed HTTPS and WSS transports.
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]

[dependencies]
app = { package = "discord-rust-app", path = "../app", version = "0.1.0" }
commands = { package = "discord-rust-commands", path = "../commands", version = "0.1.1" }
data = { package = "discord-rust-data", path = "../data", version = "0.1.0" }
enums = { package = "discord-rust-enums", path = "../enums", version = "0.1.0" }
except = { package = "discord-rust-except", path = "../except", version = "0.1.0" }
models = { package = "discord-rust-models", path = "../models", version = "0.1.1" }
util = { package = "discord-rust-util", path = "../util", version = "0.1.0" }
version = { package = "discord-rust-version", path = "../version", version = "0.1.0" }

rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }
