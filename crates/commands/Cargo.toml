[package]
name = "discord-rust-commands"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command handling, argument parsing, context menus, and cog extension primitives for discord-rust."

[dependencies]
app = { package = "discord-rust-app", path = "../app", version = "0.1.0" }
data = { package = "discord-rust-data", path = "../data", version = "0.1.0" }
enums = { package = "discord-rust-enums", path = "../enums", version = "0.1.0" }
macros = { package = "discord-rust-macros", path = "../macros", version = "0.1.1" }
models = { package = "discord-rust-models", path = "../models", version = "0.1.1" }
